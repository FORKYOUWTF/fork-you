name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Read Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: npm run build:pages
        env:
          FORK_YOU_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          FORK_YOU_SITE_URL: ${{ format('https://{0}{1}', steps.pages.outputs.host, steps.pages.outputs.base_path) }}
      - name: Check static site at the Pages base path
        run: npm run check:pages
        env:
          FORK_YOU_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
